<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4fd8">
<title>Oran Sinyal</title>
<style>
:root{--bg:#f3f6fb;--card:#ffffff;--line:#e2e8f0;--tx:#0f172a;--mut:#475569;--soft:#64748b;
--brand:#1f4fd8;--brand2:#3b82f6;
--red:#e11d48;--red-bg:#ffe4ea;--org:#ea580c;--org-bg:#ffedd5;--yel:#a16207;--yel-bg:#fef3c7;
--grn:#059669;--grn-bg:#d1fae5;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:48px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1f4fd8,#3b82f6);color:#fff;box-shadow:0 2px 12px rgba(31,79,216,.25)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}
.upd{font-size:13.5px;opacity:.92;font-weight:600}
nav{display:flex;gap:8px;padding:0 12px 12px}
nav button{flex:1;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:11px;font-size:16px;font-weight:700}
nav button.on{background:#fff;color:var(--brand)}
main{max-width:740px;margin:0 auto;padding:14px 12px}
.tip{background:#fff7ed;border:2px solid #fdba74;color:#9a3412;border-radius:14px;padding:11px 14px;font-size:15.5px;line-height:1.45;margin:0 0 14px}
.label{font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 6px}
.filters{display:flex;gap:7px;margin:0 0 12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--mut);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.match{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05)}
.mh{padding:13px 16px 10px;border-bottom:1px solid var(--line)}
.lg{display:inline-block;font-size:12.5px;font-weight:800;color:var(--brand);background:#e8efff;border-radius:6px;padding:2px 8px;margin-bottom:5px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.teams{font-weight:800;font-size:18px}
.ko{color:var(--mut);font-size:15px;font-weight:600;white-space:nowrap}
.sig{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.sig:first-of-type{border-top:0}
.badge{font-size:13.5px;font-weight:800;padding:5px 10px;border-radius:8px;white-space:nowrap}
.b-cok_guclu{background:var(--red-bg);color:var(--red)}
.b-guclu{background:var(--org-bg);color:var(--org)}
.b-zayif{background:var(--yel-bg);color:var(--yel)}
.pick{font-weight:800;font-size:18px}
.mk{display:block;color:var(--soft);font-size:14px;font-weight:600}
.odds{font-variant-numeric:tabular-nums;text-align:right;font-size:17px;white-space:nowrap;font-weight:600;color:var(--mut)}
.odds b{color:var(--grn);font-size:19px}
.drop{display:block;font-size:14px;font-weight:800;color:var(--grn)}
.meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px;align-items:center}
.tag{background:#f1f5f9;border-radius:7px;padding:3px 8px;font-weight:600}
.tag.news{background:#fee2e2;color:#b91c1c}
.tag.late{background:#ede9fe;color:#6d28d9}
.tag.ok{background:#d1fae5;color:#047857}
.tag.no{background:#f1f5f9;color:#64748b}
.vol{font-size:13.5px;color:var(--soft);font-weight:700;margin-left:8px}
details{grid-column:1/-1;font-size:14.5px;color:var(--mut)}
summary{font-weight:700;color:#b91c1c}
details a{color:var(--brand)}
.empty{text-align:center;color:var(--mut);padding:36px 18px;background:#fff;border:2px dashed #cbd5e1;border-radius:16px;font-size:17px;font-weight:600}
.note{font-size:14.5px;color:var(--soft);line-height:1.55;font-weight:500}
.quiet{background:#fff;border-radius:16px;padding:12px 16px;margin-top:6px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.quiet h4{margin:0 0 6px;font-size:15px;color:var(--mut)}
.quiet div{font-size:15px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.quiet div:last-child{border:0}
.quiet small{color:var(--soft);font-weight:600;white-space:nowrap}
.status{font-size:14px;color:var(--mut);margin-top:20px;padding:12px 4px 0;border-top:2px solid var(--line)}
.ok{color:var(--grn);font-weight:700}.bad{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--soft);font-weight:700;font-size:13.5px}
td{font-weight:600}
.box{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.box h3{margin:0 0 8px;font-size:17px}
.pos{color:var(--grn);font-weight:800}.neg{color:var(--bad);font-weight:800}
.warn{font-size:14.5px;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 10px;margin:10px 0 0;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border:0}
.res{font-weight:800;border-radius:8px;padding:4px 10px;font-size:14.5px}
.res-tuttu{background:var(--grn-bg);color:var(--grn)}.res-tutmadı{background:#fee2e2;color:var(--bad)}.res-iade{background:#f1f5f9;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Oran Sinyal</h1><div class="upd" id="upd">…</div></div>
  <nav><button id="t-sig" class="on">Sinyaller</button><button id="t-karne">Karne</button></nav>
</header>
<main>
  <section id="v-sig">
    <div class="tip">⏱ <b>En güvenilir an: maça son 1 saat.</b> Sinyaller maç başlayana kadar yarım saatte bir güncellenir; son saatte en çok veriyi ve onayı toplamış olurlar.</div>
    <div class="label">Güç</div><div class="filters" id="f-lvl"></div>
    <div class="label">Lig</div><div class="filters" id="f-lg"></div>
    <div id="list"></div>
    <div id="quiet"></div>
    <div class="status" id="status"></div>
  </section>
  <section id="v-karne" hidden>
    <div class="label">Lig</div><div class="filters" id="fk-lg"></div>
    <div id="karne"></div>
  </section>
</main>
<script>
const TZ = "Europe/Istanbul";
const LVL = {cok_guclu:"Çok güçlü", guclu:"Güçlü", zayif:"Zayıf"};
const LVL_ORDER = ["cok_guclu","guclu","zayif"];
const LVL_FILTERS = [["strong","Güçlü ve üstü",l=>l!=="zayif"],["cok_guclu","Çok güçlü",l=>l==="cok_guclu"],["guclu","Güçlü",l=>l==="guclu"],["zayif","Zayıf",l=>l==="zayif"],["all","Tümü",()=>true]];
let SIG = null, KARNE = null, fLvl = "strong", fLg = "all", fkLg = "all";
let LEAGUES = [{key:"TR1",name:"Süper Lig"}];
const lgName = k => (LEAGUES.find(l=>l.key===k)||{name:k}).name;

const fmtKO = iso => new Date(iso).toLocaleString("tr-TR",{timeZone:TZ,weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const pct = x => (x*100).toFixed(0)+"%";
const fmtK = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(Math.round(n));
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function spark(vals){
  if(!vals || vals.length<2) return "";
  const w=80,h=24,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
}

function chips(el, items, cur, onPick){
  el.innerHTML = items.map(([k,t])=>`<button class="chip ${cur===k?"on":""}" data-k="${k}">${t}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>onPick(b.dataset.k));
}

function renderSig(){
  const d = SIG;
  document.getElementById("upd").textContent = "Güncelleme " + new Date(d.updated).toLocaleTimeString("tr-TR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
  const lvlTest = LVL_FILTERS.find(f=>f[0]===fLvl)[2];
  const inLg = m => fLg==="all" || m.league===fLg;
  const cnt = test => d.matches.filter(inLg).reduce((a,m)=>a+m.signals.filter(s=>test(s.level)).length,0);
  chips(document.getElementById("f-lvl"), LVL_FILTERS.map(([k,t,f])=>[k,`${t} (${cnt(f)})`]), fLvl, k=>{fLvl=k;renderSig();});
  const lgCount = k => d.matches.filter(m=>k==="all"||m.league===k).reduce((a,m)=>a+m.signals.filter(s=>lvlTest(s.level)).length,0);
  chips(document.getElementById("f-lg"), [["all",`Tümü (${lgCount("all")})`],...LEAGUES.map(l=>[l.key,`${l.name} (${lgCount(l.key)})`])], fLg, k=>{fLg=k;renderSig();});

  const html = d.matches.filter(inLg).map(m=>{
    const sigs = m.signals.filter(s=>lvlTest(s.level));
    if(!sigs.length) return "";
    return `<div class="match"><div class="mh"><span class="lg">${esc(m.league_name||lgName(m.league))}</span>${m.pm_volume?`<span class="vol">Polymarket hacmi $${fmtK(m.pm_volume)}</span>`:""}<div class="mrow"><div class="teams">${esc(m.home)} – ${esc(m.away)}</div><div class="ko">${fmtKO(m.kickoff_iso)}</div></div></div>`+
      sigs.map(s=>{
        const pin = s.pin ? `<span class="tag">Pinnacle ${s.pin.open.toFixed(2)} → ${s.pin.cur.toFixed(2)} (−${pct(s.pin.drop)})</span>` : "";
        const news = s.news && s.news.length ? `<span class="tag news">Haber var</span>` : "";
        const late = (s.late ? `<span class="tag late">Geç hareket</span>` : "") + (s.why_lower && s.why_lower.length ? `<span class="tag no">Düşük tutuldu: ${esc(s.why_lower.join(", "))}</span>` : "");
        let hist = "";
        if(s.history && s.history.length > 1){
          const t = iso => new Date(iso).toLocaleTimeString("tr-TR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
          const up = LVL_ORDER.indexOf(s.history[s.history.length-1][1]) < LVL_ORDER.indexOf(s.history[s.history.length-2][1]);
          hist = `<span class="tag ${up?"ok":"no"}">${up?"▲":"▼"} ${s.history.map(h=>LVL[h[1]]).join(" → ")} (${t(s.history[s.history.length-1][0])})</span>`;
        }
        let conf = "";
        if(s.asia){
          const b = s.asia.books||{}, sg = b.singbet||b.sbobet, pn = b.pinnacle;
          conf += `<span class="tag ${s.asia.confirm?"ok":"no"}">Asya ${s.asia.confirm?"✓":"✗"}${sg?` ${sg.open.toFixed(2)}→${sg.cur.toFixed(2)}`:""}</span>`;
          if(pn) conf += `<span class="tag">Gerçek açılış ${pn.open.toFixed(2)}</span>`;
        }
        if(s.pm){
          conf += `<span class="tag ${s.pm.confirm?"ok":"no"}">Polymarket ${s.pm.confirm?"✓":"✗"} %${Math.round(s.pm.p_from*100)}→%${Math.round(s.pm.p_to*100)} · 24s: $${fmtK(s.pm.new_vol)} bu tarafa</span>`;
        }
        const nd = s.news && s.news.length ? `<details><summary>Haberler (${s.news.length})</summary>${s.news.map(n=>`<div>• <a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</details>`:"";
        return `<div class="sig"><span class="badge b-${s.level}">${LVL[s.level]}</span>
          <div class="pick">${esc(s.pick_label)}<span class="mk">${esc(s.market_label)}</span></div>
          <div class="odds">${s.iddaa.open.toFixed(2)} → <b>${s.iddaa.cur.toFixed(2)}</b><span class="drop">▼ ${pct(s.iddaa.drop)}</span></div>
          <div class="meta">${spark(s.spark)}${hist}${pin}${conf}${late}${news}</div>${nd}</div>`;
      }).join("") + `</div>`;
  }).join("");
  document.getElementById("list").innerHTML = html || `<div class="empty">Bu filtrede sinyal yok.<br><span class="note">Takipte ${d.tracked_matches} maç var. Oranlar yarım saatte bir kontrol ediliyor.</span></div>`;

  const q = (d.quiet_matches||[]).filter(inLg);
  document.getElementById("quiet").innerHTML = q.length ? `<div class="quiet"><h4>Sinyalsiz takipteki maçlar (${q.length})</h4>${q.slice(0,40).map(x=>`<div><span>${esc(x.home)} – ${esc(x.away)}</span><small>${esc(lgName(x.league))} · ${fmtKO(x.kickoff_iso)}</small></div>`).join("")}</div>` : "";

  const st = d.status||{};
  const lab = {iddaa:"iddaa",pinnacle:"Pinnacle",polymarket:"Polymarket",asya:"Asya",asya_kota:"Asya aylık kota",news:"Haberler",results:"Skorlar"};
  document.getElementById("status").innerHTML = "Kaynaklar: " + Object.entries(st).map(([k,v])=>`${lab[k]||k} <span class="${v==="ok"||k==="asya_kota"?"ok":"bad"}">${v==="ok"?"✓":esc(v)}</span>`).join(" · ") +
   `<p class="note"><b>Kurallar:</b> Çok güçlü = Pinnacle en az %12 + iddaa en az %4 düşüş + Asya ya da Polymarket onayı + haber yok. Güçlü = Pinnacle en az %10 + (onay ya da Pinnacle en az %15). Diğerleri zayıf. Her sinyal için en az 3 ölçüm ve 6 saat takip gerekir; geri dönen düşüşler sayılmaz. Bu araç kazanç garantisi vermez.</p>`;
}

function summarize(entries, keyFn){
  const g = {};
  entries.forEach(e=>{
    const k = keyFn(e); g[k] ||= {n:0,win:0,refund:0,oddSum:0,profit:0};
    const x = g[k];
    if(e.result!=="tuttu" && e.result!=="tutmadı"){x.refund++;return;}
    x.n++; x.oddSum+=e.odd;
    if(e.result==="tuttu"){x.win++; x.profit+=e.odd-1;} else x.profit-=1;
  });
  return g;
}

function tableHtml(g, order, label){
  const rows = order.filter(k=>g[k]).map(k=>{
    const x=g[k]; const hr = x.n? x.win/x.n:0; const roi = x.n? x.profit/x.n:0;
    return `<tr><td>${label(k)}</td><td>${x.n}</td><td>${x.n?pct(hr):"–"}</td><td>${x.n?(x.oddSum/x.n).toFixed(2):"–"}</td><td class="${roi>=0?"pos":"neg"}">${x.n?(roi>=0?"+":"")+(roi*100).toFixed(1)+"%":"–"}</td></tr>`;
  }).join("");
  return rows ? `<table><tr><th></th><th>Sinyal</th><th>Tuttu</th><th>Ort. oran</th><th>Getiri</th></tr>${rows}</table>` : `<p class="note">Henüz veri yok.</p>`;
}

function renderKarne(){
  const ALL = (KARNE && KARNE.entries) || [];
  const lgOf = e => e.league || "TR1";
  chips(document.getElementById("fk-lg"), [["all",`Tümü (${ALL.length})`],...LEAGUES.map(l=>[l.key,`${l.name} (${ALL.filter(e=>lgOf(e)===l.key).length})`])], fkLg, k=>{fkLg=k;renderKarne();});
  const E = ALL.filter(e=>fkLg==="all"||lgOf(e)===fkLg);
  const el = document.getElementById("karne");
  if(!E.length){
    el.innerHTML = `<div class="empty">Karne henüz boş.<br><span class="note">Maç başlarken sinyaller kilitlenir, maç bitince sonuç buraya işlenir.</span></div>`;
    return;
  }
  const byL = summarize(E, e=>e.level);
  const allN = Object.values(byL).reduce((a,x)=>a+x.n,0);
  const byLg = summarize(E, lgOf);
  const byM = summarize(E, e=>e.market.startsWith("AU")?"AU":e.market);
  const ML = {MS:"Maç Sonucu",IY:"İlk Yarı",CS:"Çifte Şans",KG:"Karşılıklı Gol",AU:"Alt/Üst"};
  const byNews = summarize(E, e=>e.news?"haberli":"habersiz");
  const byLate = summarize(E, e=>e.late?"gec":"erken");
  const recent = [...E].reverse().slice(0,60);
  const byConf = {...summarize(E.filter(e=>e.asia!=null), e=>e.asia?"asya_ok":"asya_no"), ...summarize(E.filter(e=>e.pm!=null), e=>e.pm?"pm_ok":"pm_no")};
  const clvRows = LVL_ORDER.map(l=>{
    const xs = E.filter(e=>e.level===l && e.clv!=null).map(e=>e.clv);
    if(!xs.length) return "";
    const avg = xs.reduce((a,b)=>a+b,0)/xs.length, pos = xs.filter(x=>x>0).length/xs.length;
    return `<tr><td><span class="badge b-${l}">${LVL[l]}</span></td><td>${xs.length}</td><td>${pct(pos)}</td><td class="${avg>=0?"pos":"neg"}">${avg>=0?"+":""}${(avg*100).toFixed(1)}%</td></tr>`;
  }).join("");
  el.innerHTML =
   `<div class="box"><h3>Güce göre</h3>${tableHtml(byL, LVL_ORDER, k=>`<span class="badge b-${k}">${LVL[k]}</span>`)}
     ${allN<30?`<p class="warn">Örneklem küçük (${allN} sinyal). En az 30–50 sinyal birikmeden sonuçlara güvenme.</p>`:""}
     <p class="note">Getiri: her sinyale 1 birim, maç başlamadan önceki son iddaa oranıyla oynanmış gibi hesaplanır.</p></div>
   <div class="box"><h3>Kapanış testi</h3>${clvRows?`<table><tr><th></th><th>Sinyal</th><th>Düşüş sürdü</th><th>Ort. fark</th></tr>${clvRows}</table>`:`<p class="note">Henüz veri yok.</p>`}
     <p class="note">Sinyal ilk çıktığındaki oran ile maç başlarkenki oran karşılaştırılır. Oran düşmeye devam ettiyse sinyal gerçek bilgiyi yakalamıştır. Bu ölçü tutma oranından çok daha hızlı anlam kazanır.</p></div>
   <div class="box"><h3>Onaylara göre</h3>${tableHtml(byConf, ["asya_ok","asya_no","pm_ok","pm_no"], k=>({asya_ok:"Asya onaylı",asya_no:"Asya onaysız",pm_ok:"Polymarket onaylı",pm_no:"Polymarket onaysız"}[k]))}
     <p class="note">Onaylar şimdilik gücü otomatik değiştirmiyor. Hangisinin işe yaradığını bu tablo gösterecek; işe yarayanı güce bağlarız.</p></div>
   ${fkLg==="all"?`<div class="box"><h3>Lige göre</h3>${tableHtml(byLg, LEAGUES.map(l=>l.key), lgName)}</div>`:""}
   <div class="box"><h3>Pazara göre</h3>${tableHtml(byM, ["MS","IY","CS","KG","AU"], k=>ML[k])}</div>
   <div class="box"><h3>Haber filtresi ve zamanlama</h3>${tableHtml({...byNews,...byLate}, ["habersiz","haberli","erken","gec"], k=>({habersiz:"Habersiz",haberli:"Haberli",erken:"Erken hareket",gec:"Geç hareket"}[k]))}</div>
   <div class="box"><h3>Son sinyaller</h3>${recent.map(e=>`<div class="row"><div><span class="badge b-${e.level}">${LVL[e.level]}</span> <b>${esc(e.pick_label)}</b> @${e.odd.toFixed(2)}${e.clv!=null?` <span class="${e.clv>=0?"pos":"neg"}" style="font-size:14px">(${e.clv>=0?"+":""}${(e.clv*100).toFixed(0)}%)</span>`:""}${e.asia?" 🌏":""}${e.pm?" 💰":""}<div class="note">${esc(lgName(lgOf(e)))} · ${esc(e.home)} – ${esc(e.away)} · <b>${esc(e.score)}</b>${e.ht?` (İY ${esc(e.ht)})`:""} · ${new Date(e.kickoff).toLocaleDateString("tr-TR",{timeZone:TZ})}</div></div><span class="res res-${e.result}">${e.result}</span></div>`).join("")}</div>`;
}

function tab(which){
  document.getElementById("t-sig").classList.toggle("on",which==="sig");
  document.getElementById("t-karne").classList.toggle("on",which==="karne");
  document.getElementById("v-sig").hidden = which!=="sig";
  document.getElementById("v-karne").hidden = which!=="karne";
  if(which==="karne") renderKarne();
}
document.getElementById("t-sig").onclick=()=>tab("sig");
document.getElementById("t-karne").onclick=()=>tab("karne");

(async()=>{
  const nc = "?t="+Date.now();
  try{
    SIG = await (await fetch("data/signals.json"+nc)).json();
    if(SIG.leagues && SIG.leagues.length) LEAGUES = SIG.leagues;
    renderSig();
  } catch(e){ document.getElementById("list").innerHTML = `<div class="empty">Veri henüz oluşmadı. İlk çalıştırmadan sonra burası dolacak.</div>`; }
  try{ KARNE = await (await fetch("data/karne.json"+nc)).json(); }catch(e){ KARNE = {entries:[]}; }
})();
</script>
