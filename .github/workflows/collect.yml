name: Oran topla

on:
  schedule:
    - cron: "7,37 * * * *"   # yarım saatte bir
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Topla ve sinyal üret
        id: run
        env:
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
        run: |
          set +e
          python collector/main.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Kaydet
        run: |
          git config user.name "kod34x-png"
          git config user.email "kod34x@gmail.com"   # Vercel Hobby yalnız hesap sahibinin commitlerini yayınlar
          git add state web/data
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "veri: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Toplama hatası varsa işi kırmızı yap
        if: steps.run.outputs.code != '0'
        run: exit 1
